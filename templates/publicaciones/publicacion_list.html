{% extends 'base.html' %}
{% block content %}
    {% for pub in publicacion_list %}
            <h1>{{ pub.titulo }}</h1>
            <p><b>Autor: </b>{{ pub.autor }}</p>
            <p><b>Fecha: </b>{{ pub.fecha_publicacion }}</p>
            <a href="{% url 'publicaciones:detalle_publicacion' pub.pk %}">Ver publicacion</a>
            {% empty %}
            <p>No hay publicaciones disponibles.</p>
    {% endfor %}
{% endblock %}
